name: Metadata checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f LICENSE
          test -f README.md
          test -f CITATION.cff
          test -f .zenodo.json
          test -f codemeta.json
          test -f CONTRIBUTING.md
      - name: Validate JSON metadata
        run: |
          python -m json.tool .zenodo.json > /dev/null
          python -m json.tool codemeta.json > /dev/null
      - name: Check TODO placeholders
        run: |
          echo "TODO placeholders are allowed in the template repository."
          grep -R "TODO" README.md CITATION.cff .zenodo.json codemeta.json docs || true
